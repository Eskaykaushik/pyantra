[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyantra-guard"
version = "0.5.1"
description = "Type guards, budget caps, and PII redaction for Pyantra."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Eskay Kaushik", email = "eskaykaushik14@gmail.com" }]
keywords = ["ai", "agents", "workflows", "guard", "pii", "budget"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["pyantra"]

[project.urls]
Homepage = "https://github.com/Eskaykaushik/pyantra"
Repository = "https://github.com/Eskaykaushik/pyantra"

[tool.hatch.build.targets.wheel]
packages = ["pyantra_guard"]
include = ["pyantra_guard/py.typed"]
