[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyantra"
version = "0.1.0"
description = "Typed, observable, reliable Python workflows for AI agents."
readme = "readme.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eskay Kaushik", email = "eskaykaushik14@gmail.com" }]
keywords = ["ai", "agents", "workflows", "graph", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Eskaykaushik/pyantra"
Repository = "https://github.com/Eskaykaushik/pyantra"

[tool.hatch.build.targets.wheel]
packages = ["pyantra"]
include = ["pyantra/py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 88
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
