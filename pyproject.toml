[project]
name = "pyantra-workspace"
version = "0.4.0"
description = "Pyantra monorepo workspace root."
requires-python = ">=3.10"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pyantra = { workspace = true }
pyantra-eval = { workspace = true }
pyantra-guard = { workspace = true }
pyantra-memory = { workspace = true }
pyantra-otel = { workspace = true }
pyantra-studio = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py310"
line-length = 88
include = ["*.py", "*.pyi"]
src = ["packages/pyantra-core", "packages/pyantra-eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "packages/pyantra-core/tests",
    "packages/pyantra-guard/tests",
    "packages/pyantra-eval/tests",
]
